name: Run a.sh

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x a/a.sh

      - name: Run a.sh
        run: |
          cd a
          ./a.sh
